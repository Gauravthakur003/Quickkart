
spring.application.name=quickkart-api
server.port=${SERVER_PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=QuickKartDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:quickkart_user}
spring.datasource.password=${DB_PASSWORD:Gaurav@2054}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:QuickKartDevelopmentSecretKeyChangeThisBeforeProduction123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
